name: Release

# Tag a version (git tag v1.2.3 && git push --tags) to:
#  1. run the full test suite,
#  2. build and push the add-on image for amd64 + aarch64 to GHCR,
#  3. create a GitHub Release with the matching CHANGELOG section.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check oneroof_zigbee tests oneroof-zigbee --select E,F,B --ignore E501,B905
      - run: pytest -q --timeout=180
      - name: Tag must match the package version
        run: |
          V=$(python -c "import oneroof_zigbee;print(oneroof_zigbee.__version__)")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package v$V"; exit 1; }
          grep -q "version: \"$V\"" oneroof-zigbee/config.yaml || { echo "add-on config.yaml version != $V"; exit 1; }
          cmp -s CHANGELOG.md oneroof-zigbee/CHANGELOG.md || { echo "oneroof-zigbee/CHANGELOG.md is out of sync with CHANGELOG.md (cp CHANGELOG.md oneroof-zigbee/)"; exit 1; }

  image:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build & push ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: oneroof-zigbee
          file: oneroof-zigbee/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/noammgr/oneroof-zigbee-${{ matrix.arch }}:${{ github.ref_name }}
            ghcr.io/noammgr/oneroof-zigbee-${{ matrix.arch }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            io.hass.version=${{ github.ref_name }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's changelog section
        run: |
          V=${GITHUB_REF_NAME#v}
          awk -v v="$V" '/^## \[/{p = index($0, "[" v "]") > 0} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          name: OneRoof Zigbee ${{ github.ref_name }}
