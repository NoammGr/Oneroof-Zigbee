<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>OneRoof Zigbee</title>
<style>
:root{
  --bg:#faf7f2;--card:#ffffff;--card-2:#f4efe7;--line:#eae3d8;--ink:#33302b;--ink-2:#8a8175;
  --accent:#e2603c;--accent-soft:#fdeee8;--accent-ink:#fff;
  --ok:#2f9e6e;--ok-soft:#e6f5ee;--warn:#b98a2f;--warn-soft:#faf3e2;
  --danger:#c0392b;--danger-soft:#fbe7e8;
  --surface:var(--card);--mute:var(--ink-2);--faint:#b3aa9c;--line2:#f2ede5;--off:#d6cec2;
  --shadow:0 1px 2px rgba(51,48,43,.06),0 8px 24px rgba(51,48,43,.06);
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Plus Jakarta Sans",-apple-system,"Segoe UI",sans-serif;
  --head:"Bricolage Grotesque",Georgia,serif;
  --r:18px;--rb:12px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#191713;--card:#232019;--card-2:#2c2820;--line:#332f26;--ink:#f1ece3;--ink-2:#9d9485;
  --accent:#f0703f;--accent-soft:#3a281f;--ok:#4cc38a;--ok-soft:#1f3329;--warn:#d9aa4e;--warn-soft:#38301c;
  --danger:#e5695a;--danger-soft:#3b2321;--faint:#6f675c;--line2:#2a261f;--off:#4a443a;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:.01em}
.mute{color:var(--mute)}
.hidden{display:none!important}
svg.i{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em}
/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr;min-height:100vh}
.shell{grid-row:3}
header .ver{color:var(--faint);font-size:12px;padding-left:6px;border-left:1px solid var(--line)}
header{display:flex;align-items:center;gap:18px;padding:0 24px;height:60px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.brand{font-family:var(--head);font-weight:800;letter-spacing:-.02em;font-size:19px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:26px;height:26px;border-radius:9px;background:var(--accent);display:inline-grid;place-items:center;color:var(--accent-ink)}
.brand span{color:var(--ink-2);font-weight:600}
.rail{display:flex;align-items:center;gap:14px;margin-left:auto;font-size:12.5px;color:var(--mute);white-space:nowrap}
.rail .item{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--off);display:inline-block;flex:none}
.dot.on{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent)}60%{box-shadow:0 0 0 6px transparent}}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--mute);background:var(--card)}
.badge.open,.badge.ok{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.badge.sec,.badge.danger{border-color:transparent;background:var(--danger-soft);color:var(--danger)}
.badge.sec{cursor:pointer;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.badge.warn{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.badge.acc{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);min-width:0}
nav.side{padding:22px 14px;border-right:1px solid var(--line)}
nav.side a,.tabs a{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:99px;color:var(--mute);text-decoration:none;font-weight:600;margin-bottom:4px}
nav.side a:hover{background:var(--card-2);color:var(--ink)}
nav.side a.active{color:var(--accent);background:var(--accent-soft)}
nav.side a svg.i,.tabs a svg.i{font-size:20px;stroke-width:1.6;opacity:.85}
nav a.active svg.i{opacity:1}
main{padding:32px 36px 100px;max-width:1680px;width:100%;min-width:0}
.tabs{display:none}
h1{font-family:var(--head);font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;line-height:1.15}
.lead{color:var(--mute);margin:0 0 22px;max-width:64ch}
h2{font-family:var(--head);font-size:17px;font-weight:800;letter-spacing:-.02em;margin:30px 0 12px}
h2:first-child{margin-top:0}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar .grow{flex:1}
input[type=text],input[type=search],input[type=number],input[type=password],input[type=file],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:var(--rb);padding:8px 12px;min-width:0;font:inherit;color:inherit}
textarea{width:100%;resize:vertical}
input:disabled,select:disabled,textarea:disabled{opacity:.6;background:var(--card-2)}
input[type=search]{width:280px;max-width:100%}
input[type=file]{padding:5px 8px;color:var(--mute);font-size:12.5px}
input[type=file]::file-selector-button{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 12px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);margin-right:10px;cursor:pointer}
input[type=file]::file-selector-button:hover{border-color:var(--ink-2);background:var(--card-2)}
input.sm,select.sm{padding:4px 8px;font-size:12.5px;border-radius:9px}
input[type=number].sm{width:78px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:var(--rb);padding:8px 14px;font-weight:600;line-height:1.2;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--ink-2);background:var(--card-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(.94)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.danger.primary{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:9px}
.btn.icon{padding:5px 7px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--card)}
.seg button{background:transparent;border:0;padding:6px 14px;color:var(--mute);font-weight:600}
.seg button.active{background:var(--accent-soft);color:var(--accent)}
.seg button.on.active{background:var(--ok-soft);color:var(--ok)}
.seg.sm button{padding:4px 10px;font-size:12.5px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}
.pills button{background:transparent;border:1px solid transparent;border-radius:99px;padding:7px 14px;color:var(--mute);font-weight:600}
.pills button:hover{background:var(--card-2);color:var(--ink)}
.pills button.active{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow)}
.notice{border-left:3px solid var(--accent);padding:12px 16px;background:var(--accent-soft);border-radius:0 var(--rb) var(--rb) 0;margin-bottom:16px}
.notice.warn{border-color:var(--warn);background:var(--warn-soft)}
.coord-banner{background:var(--warn);color:#1a1205;font-weight:600;text-align:center;padding:10px 16px;font-size:14px}
.coord-banner.hidden{display:none}
/* ---------- tables ---------- */
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card)}
.devname{color:var(--accent);font-weight:600;text-decoration:none}.devname:hover{text-decoration:underline}
.twrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card-2)}
td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--card-2)}
.devtab td:nth-child(3),.devtab td:nth-child(5),.devtab .btn{white-space:nowrap}
.devtab .name{white-space:nowrap}
.name{font-weight:700;cursor:text}
.name:hover{text-decoration:underline dotted var(--mute)}
.name input{padding:2px 6px;width:160px}
.sub{font-size:12px;color:var(--mute)}
.empty{padding:40px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.lqi{display:inline-block;height:6px;width:60px;background:var(--line);border-radius:3px;position:relative;vertical-align:middle;margin-right:6px}
.lqi i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.thumb{width:38px;height:38px;border-radius:50%;background:var(--card-2);color:var(--ink-2);display:grid;place-items:center;font-size:18px;flex:none}
/* ---------- device controls ---------- */
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl input[type=range]{width:110px;accent-color:var(--accent)}
.menu{position:relative}
.menu .pop{position:fixed;background:var(--card);border:1px solid var(--line);border-radius:var(--rb);box-shadow:var(--shadow);z-index:4;min-width:170px;padding:6px}
.menu .pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;font-weight:500}
.menu .pop button:hover:not(:disabled){background:var(--card-2)}
.menu .pop button.danger{color:var(--danger)}
/* ---------- device detail ---------- */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--mute);text-decoration:none;font-weight:600;font-size:13px;margin-bottom:14px}
.back:hover{color:var(--ink)}
.dhead{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.dhead .grow{flex:1;min-width:240px}
.dhead h1{cursor:text}.dhead h1:hover{text-decoration:underline dotted var(--mute)}
.dhead h1 input{font:inherit;letter-spacing:inherit;width:100%;max-width:420px;padding:0 6px;border-radius:var(--rb);border:1px solid var(--line);background:var(--card)}
.desc{color:var(--mute);cursor:text;margin:0 0 12px;min-height:1.4em}
.desc.placeholder{color:var(--faint);font-style:italic}
.desc input{width:100%;max-width:520px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.kvt{width:100%}
.kvt td{padding:12px 16px}
.kvt td:first-child{color:var(--mute);width:200px;font-weight:600;vertical-align:top}
.kvt .sub{margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--card-2);font-size:12px;color:var(--ink)}
.chip .mono{color:var(--mute)}
.tag{display:inline-flex;align-items:center;padding:1px 7px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:middle}
.tag.mute{background:var(--card-2);color:var(--mute)}
.dptab td{vertical-align:top}.dptab .mono{font-size:12.5px}.dpedit{background:var(--card-2);border-radius:var(--rb);padding:12px 14px;margin:4px 0 8px}.dpedit .fgrid{gap:8px 12px}.dpedit .field label{font-size:11.5px}
.epcard{margin-top:12px}
.act{display:flex;gap:10px;font-size:12.5px;padding:3px 0}
.act .t{color:var(--faint);flex:none;font-family:var(--mono)}
.act b{font-weight:600}
.topic{display:flex;align-items:center;gap:8px;padding:3px 0}
.topic .mono{word-break:break-all}
.feat{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(220px,44%);gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line2)}
.feat:last-child{border-bottom:0}
.feat .ico{width:40px;height:40px;border-radius:12px;background:var(--card-2);color:var(--accent);display:grid;place-items:center;font-size:20px}
.feat .nm{font-weight:700}
.feat .ds{font-size:12.5px;color:var(--mute)}
.feat .ctrl{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap}
.bigval{font-family:var(--head);font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1}
.bigval small{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--mute);margin-left:4px;letter-spacing:0}
.range{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;width:100%;max-width:360px}
.range input[type=range]{width:100%;accent-color:var(--accent)}
.range .lim{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}
.range .num{display:flex;align-items:center;gap:4px}
.range .num input{width:84px}
.btng{display:inline-flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.btng button{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-weight:600;color:var(--mute);font-size:12.5px}
.btng button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
pre{font-family:var(--mono);font-size:12.5px;background:var(--card-2);border-radius:var(--rb);padding:14px 16px;overflow:auto;margin:0;max-height:60vh}
.readout{margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.inline td input,.inline td select{width:100%}
/* ---------- pair ---------- */
.pair{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}
.ring{position:relative;width:200px;height:200px;margin:8px auto 14px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .track{stroke:var(--line)}
.ring .arc{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-family:var(--head);font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .val span{font-size:12px;color:var(--mute);margin-top:4px}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field label{font-size:12.5px;font-weight:700}
.field .hint{font-size:12px;color:var(--mute)}
.field input{font-family:var(--mono)}
.field .err{font-size:12px;color:var(--danger)}
.feed{font-family:var(--mono);font-size:12.5px;max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
.feed div{padding:7px 12px;border-bottom:1px solid var(--line2);display:flex;gap:10px}
.feed .t{color:var(--faint);flex:none}
/* ---------- map ---------- */
#mapc{width:100%;height:620px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:block;touch-action:none;box-shadow:var(--shadow)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mute);margin:10px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
/* ---------- logs ---------- */
.log{font-family:var(--mono);font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);height:60vh;min-height:300px;overflow:auto;box-shadow:var(--shadow)}
.log .row{display:grid;grid-template-columns:150px 64px 1fr;gap:10px;padding:6px 14px;border-bottom:1px solid var(--line2);white-space:pre-wrap;word-break:break-word}
.log .row.sec{background:var(--danger-soft);border-left:3px solid var(--danger)}
.log .row.ERROR{color:var(--danger)}.log .row.WARNING{color:var(--warn)}
.log .row.DEBUG{color:var(--faint)}
.log .t{color:var(--faint)}.log .l{color:var(--mute)}
.log .row.sec .l{color:var(--danger);font-weight:700}
/* ---------- settings ---------- */
.kv{display:grid;grid-template-columns:max-content 1fr;gap:10px 28px;align-items:baseline;margin:0}
.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-all}
.card h3{margin:18px 0 6px;font-size:14.5px;font-family:var(--head);font-weight:800;letter-spacing:-.01em}
.card h3:first-child{margin-top:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 20px}
.field select,.field textarea{font-family:var(--mono)}
.field select,.field input{max-width:100%}
.field input[type=file]{font-family:var(--sans);padding:6px 10px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;cursor:pointer}
.chk input{margin:3px 0 0;accent-color:var(--accent);flex:none}
.chk .hint{font-size:12px;color:var(--mute);font-weight:400}
.cfoot{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}
.cfoot .sub{margin-right:auto}
.notice.danger{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.notice.restart{position:sticky;top:68px;z-index:4;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.notice.restart .grow{flex:1;min-width:200px}
.sub-panel{margin-top:18px;padding:14px 16px;background:var(--card-2);border-radius:var(--rb)}
.imp-found{margin:0 0 14px}.imp-found h3{margin:0 0 4px}.imp-row{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:10px 12px;border:1px solid transparent;border-radius:var(--rb);background:var(--card);margin-top:8px}.imp-row.sel{border-color:var(--accent);background:var(--accent-soft)}.imp-row .path{flex:1 1 200px;min-width:0;overflow-wrap:anywhere;font-size:13px}.imp-row .chips{flex:1 1 auto}.imp-row .chip.miss{color:var(--mute);opacity:.7}.imp-row .chip.have{background:var(--ok-soft);color:var(--ok)}.imp-or{display:flex;align-items:center;gap:10px;margin:14px 0 10px;color:var(--mute);font-size:12px}.imp-or::before,.imp-or::after{content:'';flex:1;border-top:1px solid var(--line,var(--card-2))}
.steps{margin:6px 0 0;padding-left:20px}.steps li{margin:3px 0}
.twrap.flat{box-shadow:none;margin-bottom:8px}
.utab td{vertical-align:top}.utab .acts{gap:4px;justify-content:flex-end}
.utab details summary{font-weight:600;font-size:12px;color:var(--accent)}
.utab .filt{white-space:pre-line;font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(25,23,19,.5);display:grid;place-items:center;z-index:60}
.danger-zone{border:1px solid var(--danger-soft);border-radius:var(--rb);padding:14px 16px;margin-top:20px}
.danger-zone h3{margin:0 0 6px;color:var(--danger);font-size:15px}
/* ---------- misc ---------- */
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);padding:22px 24px;max-width:440px;width:calc(100% - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(25,23,19,.45)}
dialog h3{margin:0 0 8px;font-size:18px;font-family:var(--head);font-weight:800;letter-spacing:-.02em}
dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:340px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--rb);font-size:13px;box-shadow:var(--shadow);animation:in .2s ease-out}
.toast.err{background:var(--danger);color:#fff}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.tip[title]{cursor:help}
/* ---------- help popover ---------- */
.help{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:5px;padding:0;border:0;background:none;color:var(--ink-2);border-radius:50%;cursor:help;vertical-align:-4px;flex:none}
.help:hover,.help:focus-visible,.help.open{color:var(--accent)}
.help svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.field label,.card h3,.kv dt,.feat .nm{display:flex;align-items:center;gap:2px}
.kv dt{align-self:center}
.chk .help{margin-left:4px}
#helppop{position:fixed;z-index:70;max-width:min(320px,calc(100vw - 16px));background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px;font-size:12.5px;line-height:1.5;font-weight:400;color:var(--ink);pointer-events:none}
#helppop b{display:block;font-weight:700;margin-bottom:2px}
.btn.text{background:none;border-color:transparent;padding:8px 6px}
.btn.text.danger{background:none}
.btn.text:hover:not(:disabled){background:var(--danger-soft);border-color:transparent}
.plain-note{font-size:12px;color:var(--danger)}
/* ---------- dashboard ---------- */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px;align-items:stretch}
.dcard{height:288px;padding:14px 16px;display:flex;flex-direction:column;min-width:0}
.dbody{flex:1;min-height:0;overflow:hidden}
.dcard .frow{padding:5px 0;font-size:12.5px}
.dcard .frow .fn{min-width:76px}
.dcard .frow>:last-child{flex:0 1 auto;min-width:0;max-width:64%}
.dcard .range{max-width:150px}
.dcard select,.dcard input[type=number],.dcard input[type=text]{padding:3px 8px;font-size:12px}
.dmore{font-size:11.5px;color:var(--mute)}
.dcard.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dcard.dim{opacity:.4}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dh .thumb{width:32px;height:32px;font-size:16px}
.dh a{flex:1;min-width:0;font-weight:700;color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh a:hover{text-decoration:underline}
.frow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px}
.frow:last-child{border-bottom:0}
.frow .fn{flex:1;min-width:0;color:var(--mute);display:flex;align-items:center;gap:7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.frow .fn svg.i{opacity:.7}
.ctrl.cmp{gap:6px}
.ctrl.cmp input[type=range]{width:90px;accent-color:var(--accent)}
.val{font-weight:700}.val small{color:var(--mute);font-weight:500;margin-left:3px;font-size:11.5px}
.sw{position:relative;width:38px;height:22px;flex:none;display:inline-block}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--off);transition:background .15s;pointer-events:none}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--ok)}.sw input:checked+i::after{transform:translateX(16px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.dfoot{display:flex;gap:6px;align-items:center;margin-top:auto;padding-top:8px;border-top:1px solid var(--line2)}
.dfoot .grow{flex:1}.dfoot .back{margin:0}
/* ---------- activity ---------- */
.arow{display:grid;grid-template-columns:32px minmax(120px,200px) 150px minmax(0,1fr);gap:12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line2)}
.arow:last-child{border-bottom:0}
.arow .thumb{width:32px;height:32px;font-size:16px}
.arow .aname{font-weight:700;color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .aname:hover{text-decoration:underline}
.arow .chg{font-family:var(--mono);font-size:12.5px;word-break:break-word}
.arow .chg b{font-weight:600;color:var(--mute)}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);transition:width .4s}
@media (max-width:760px){
  .dgrid{grid-template-columns:1fr}
  .arow{grid-template-columns:28px minmax(0,1fr);gap:6px 10px}.arow .chg{grid-column:1/-1}.arow .sub{font-size:11px}
  .tabs{overflow-x:auto;padding-left:2px;padding-right:2px}.tabs a{padding:5px 4px;font-size:10px;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap}
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.side{display:none}
  .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:5;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabs a{flex-direction:column;gap:2px;font-size:11px;padding:5px 10px;margin:0;border-radius:14px}
  .tabs a.active{color:var(--accent);background:var(--accent-soft)}
  .tabs a svg.i{font-size:22px}
  .notice.restart{top:60px}
  header{padding:0 14px;gap:8px;overflow:hidden;height:54px}header .badge{max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;line-height:20px}header .mute{display:none}header .ver{display:none}
  .brand span{display:none}
  .rail{gap:8px;min-width:0}.rail .item.devs{display:none}
  #h-bridge span{display:none}
  .badge.sec{max-width:130px;white-space:nowrap}
  main{padding:20px 14px 96px}
  h1{font-size:24px}
  .pair{grid-template-columns:1fr}
  .devtab th:nth-child(2),.devtab td:nth-child(2),.devtab th:nth-child(3),.devtab td:nth-child(3){display:none}
  .log .row{grid-template-columns:84px 52px 1fr}
  #mapc{height:440px}
  #toasts{left:16px;max-width:none;bottom:80px}
  .feat{grid-template-columns:40px minmax(0,1fr)}
  .feat .ctrl{grid-column:1/-1;justify-content:flex-start}
  .kvt td:first-child{width:120px}
  .grid2{grid-template-columns:1fr}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div id="app">
<header>
  <div class="brand"><i id="brand-i"></i><b>OneRoof</b><span>Zigbee</span></div>
  <div class="rail">
    <div class="item" id="h-bridge"><i class="dot"></i><span>connecting…</span></div>
    <div class="item devs" id="h-devs">— devices</div>
    <span class="badge" id="h-join">join closed</span>
    <span class="badge sec hidden" id="h-sec" role="button" tabindex="0" title="Open security log"></span>
    <span class="item ver mono" id="h-ver" title="One Roof Zigbee version"></span>
  </div>
</header>
<div id="coord-banner" class="coord-banner hidden">⚠️ Coordinator offline — the Zigbee dongle is disconnected. Reconnecting automatically; your devices are unreachable until it returns.</div>
<div class="shell">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs"></nav>
</div>
<div id="toasts"></div>
<dialog id="dlg"><h3 id="dlg-t"></h3><div id="dlg-b"></div><div class="acts"><button class="btn" id="dlg-no">Cancel</button><button class="btn primary" id="dlg-ok">Confirm</button></div></dialog>

function svg(name,size){const NS='http://www.w3.org/2000/svg';const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('class','i');s.setAttribute('aria-hidden','true');if(size)s.style.fontSize=size+'px';const p=document.createElementNS(NS,'path');p.setAttribute('d',ICONS[name]||ICONS.chip);s.append(p);return s;}
async function api(path,body,method){
  const opt=body===undefined?{}:{method:method||'POST',headers:{'Content-Type':'application/json','X-OneRoof':'1'},body:JSON.stringify(body)};
  opt.cache='no-store';

function toast(msg,err){const t=el('div',{class:'toast'+(err?' err':''),text:msg});$('#toasts').append(t);setTimeout(()=>t.remove(),err?6000:3200);}
function confirmDlg(title,bodyNodes,okLabel,danger){return new Promise(res=>{const d=$('#dlg');$('#dlg-t').textContent=title;clear($('#dlg-b')).append(...bodyNodes);const ok=$('#dlg-ok');ok.textContent=okLabel||'Confirm';ok.className='btn primary'+(danger?' danger':'');const done=v=>{d.close();ok.onclick=null;$('#dlg-no').onclick=null;res(v);};ok.onclick=()=>done(true);$('#dlg-no').onclick=()=>done(false);d.onclose=()=>res(false);d.showModal();});}
function tsMs(ts){return typeof ts==='number'?(ts<1e12?ts*1000:ts):Date.parse(ts);}
function rel(ts){if(!ts)return 'never';const t=tsMs(ts);if(isNaN(t))return String(ts);const s=Math.max(0,(Date.now()-t)/1000);if(s<45)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' d ago';}

function fmtVal(v){if(v===null||v===undefined)return '—';if(typeof v==='number')return Number.isInteger(v)?String(v):String(+v.toFixed(2));if(typeof v==='object')return JSON.stringify(v);return String(v);}

/* ============ help texts (edit here) ============ */
const HELP={
  'serial.port':'Device file of the USB coordinator (/dev/ttyUSB0 or, better, /dev/serial/by-id/… which survives re-plugging), or tcp://host:port for a network coordinator.',
  'serial.baudrate':'Speed of the serial link. 115200 is right for almost every TI stick; change it only if the firmware documentation says so, otherwise the coordinator will not answer.',
  'serial.rtscts':'Hardware flow control on the serial line. Leave it off unless the adapter documentation asks for it; a wrong value makes the coordinator look dead.',
  'serial.adapter':'Coordinator firmware family. Only Texas Instruments Z-Stack 3 (CC2652, CC1352, CC2538) is supported, so this value cannot be changed.',
  'serial.network':'Network coordinators expose the serial port over plain TCP: neither encrypted nor authenticated, so anyone on that network segment can drive the radio. Keep it on a trusted VLAN.',
  'zigbee.channel':'IEEE 802.15.4 channel 11–26. Channels 15, 20 and 25 avoid the busiest Wi-Fi bands. Changing it re-forms the network: every device must be paired again.',
  'zigbee.permit_join_max_seconds':'Upper bound for any join window opened from the UI or over MQTT (1–254 s). While the window is open, the network key is handed to any device that asks, so keep this short.',
  'zigbee.permit_join_cooldown_seconds':'Minimum pause between two join windows. Stops a compromised MQTT client from keeping the network permanently open by re-requesting permit_join in a loop.',
  'zigbee.permit_join_require_install_code':'Plain join windows are refused; every device must be paired with the install code printed on it. The network key then travels encrypted with a per-device key, so a sniffer present during pairing learns nothing.',
  'zigbee.permit_join_close_after_first_join':'A join window without install code admits exactly one device and closes the moment it joins, so nothing can slip in behind it. Pair devices one at a time.',
  'zigbee.rotation_require_all':'Switch to the new key only when every device demonstrably received it: routers must answer on the current key first, battery devices are handed the key the moment they are heard, and the key keeps being offered for as long as it takes — through restarts too. Past the maximum wait a "stalled" alert names who is holding it up: remove a device that is gone for good, or cancel. Off: switch anyway after the maximum wait; the devices that missed it must rejoin.',
  'zigbee.rotation_interval_days':'The key also rotates by itself every this many days (0 = never) — an old key is a standing target. It runs through the same evidence rules as a manual rotation and waits politely: never while you are pairing devices, never while another rotation runs.',
  'zigbee.rotation_max_window_minutes':'After this long with devices still missing the rotation raises a "stalled" alert (and, with the option above off, switches anyway). Battery sensors that report rarely need hours.',
  'zigbee.rotate_key_after_plain_join':'A device paired without an install code receives the network key under the public key; a sniffer present at that moment may have captured it. After such a pairing the key is rotated over the air within minutes (the new device already has its own link key by then), so the exposed key dies young.',
  'zigbee.strict_install_codes':'Replaces the public ZigBeeAlliance09 link key with a random one, so a device can only join with its install code. Strongest setting, but devices that do not print an install code cannot be paired at all.',
  'mqtt.listen':'Interface the broker binds to. 0.0.0.0 = all interfaces (needed when Home Assistant runs elsewhere); 127.0.0.1 keeps it local to this host.',
  'mqtt.port':'TCP port of the MQTT broker. 8883 is the convention for MQTT over TLS, 1883 for plaintext. Home Assistant connects here — no separate broker is needed.',
  'mqtt.plaintext_port':'A second, unencrypted listener for legacy devices that cannot do TLS. Passwords and device state cross the network readable; leave empty unless you really need it.',
  'mqtt.base_topic':'Prefix of every device topic, e.g. zigbee/Kitchen plug. Change it only before connecting Home Assistant; discovery and automations reference the full topic.',
  'mqtt.tls.mode':'auto (recommended): the gateway issues its own certificate authority and server certificate; give clients ca.crt once. custom: bring your own certificate and key. off: plaintext — anyone on the network can read credentials and device state; only for loopback testing.',
  'mqtt.tls.cert':'Path to the server certificate (PEM, full chain if an intermediate is involved). Its names must match what clients connect to.',
  'mqtt.tls.key':'Path to the unencrypted private key matching the certificate. Keep it readable by the gateway only; whoever has it can impersonate the broker.',
  'mqtt.tls.client_ca':'Mutual TLS: clients must present a certificate signed by this CA in addition to a password ("require client certificate"). Strong, but every client then needs its own certificate.',
  'mqtt.tls.hostnames':'Extra names or IP addresses written into the auto-issued certificate. Add every address clients use (homeassistant.local, 192.168.1.10), otherwise their TLS check fails.',
  'users.name':'MQTT username. Give each client its own user so a leaked credential can be revoked without touching the others.',
  'users.role':'Preset of topic permissions. homeassistant: read everything, set/get devices, no network control. admin: everything. readonly: subscribe only. custom: your own subscribe/publish filters.',
  'users.control':'Control users may open the join window, remove devices and rotate the network key. Home Assistant normally should NOT have this, so a leaked HA token cannot add a device to your network.',
  'users.password':'At least 12 characters; stored as a salted hash, never in clear. Leave blank while editing to keep the current one.',
  'users.subscribe':'Topic filters this user may read, one per line (+ and # wildcards). Everything else is silently denied.',
  'users.publish':'Topic filters this user may write, one per line. Limiting a client to zigbee/+/set means it can switch devices but never touch the bridge topics.',
  'homeassistant.discovery':'Publishes entity descriptions under the discovery prefix so devices appear in Home Assistant automatically. Only the gateway should be allowed to publish there: whoever can write to that prefix can create fake entities.',
  'homeassistant.discovery_prefix':'Topic prefix Home Assistant watches for discovery messages. Must match the MQTT integration setting; homeassistant is the default on both sides.',
  'ui.acts_as':'MQTT user whose permissions this web UI uses. Control actions (pair, remove, rotate key) work only if that user has control.',
  'ui.port':'Port of this web UI. It binds to loopback or the Home Assistant Ingress only and is never exposed to the network, because it has no login of its own.',
  'ui.enabled':'Turns the web UI off completely. The MQTT API keeps working.',
  'backup.password':'Encrypts the backup (network key, TLS keys, device database, config). Without this password the file is useless — store it with the file, not in it.',
  'backup.file':'An .ozbk file created by this gateway. Restoring replaces the current keys and database, so devices paired after the backup need re-pairing.',
  'maintenance.log_level':'Verbosity of the application log until the next restart. DEBUG logs every frame and can include device payloads; use it briefly.',
  'maintenance.restart':'Restarts the whole process: broker, coordinator link and this UI. Devices keep their state and reconnect by themselves; expect a few seconds of downtime.',
  'maintenance.rotate':'Over the air: the new network key is handed to every device encrypted under that device\'s own link key, then everyone switches. Nothing is re-paired. Whoever holds only the old network key is locked out. A device asleep through the whole window rejoins with its link key and picks the key up then.',
  'maintenance.rotate_window':'How long to wait between handing out the key and switching to it. Devices that refused the key are offered it again every 30 s during the window. Battery devices receive the key from their parent router when they next wake; longer windows reach more of them before the switch, the rest rejoin afterwards.',
  'maintenance.repair':'Fresh network key AND fresh trust-centre seed on the next start. Every device must be paired again. Needed only when the seed may have leaked too (for example the previous setup\'s backup files) — over-the-air rotation alone does not exclude someone who has both.',
  'pair.seconds':'How long the network accepts new devices. The network key is handed to anyone who joins in this window, so keep it just long enough to press the button on the device.',

function hideHelp(force){if(!helpPop||(helpPin&&!force))return;helpPin=false;helpPop.classList.add('hidden');if(helpCur){helpCur.classList.remove('open');helpCur.removeAttribute('aria-describedby');helpCur=null;}}

  const t=helpText(id,fallback);if(!t)return null;

  const b=el('button',{type:'button',class:'help','aria-label':'Help: '+(title||id),'data-help':t,'data-title':title||''},s);
  b.addEventListener('mouseenter',()=>{if(!helpPin)showHelp(b);});b.addEventListener('mouseleave',()=>{if(!helpPin)hideHelp();});
  b.addEventListener('focus',()=>showHelp(b));b.addEventListener('blur',()=>hideHelp());
  b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(helpPin&&helpCur===b)hideHelp(true);else{helpPin=false;showHelp(b);helpPin=true;}});

}

function stateSummary(st){
  if(!st||typeof st!=='object')return '';const p=[];
  if('state'in st)p.push(String(st.state));
  if(typeof st.brightness==='number')p.push(Math.round(st.brightness/254*100)+'%');
  if(typeof st.color_temp==='number')p.push(st.color_temp+' mired');
  if(typeof st.position==='number')p.push('pos '+st.position+'%');
  if(typeof st.temperature==='number')p.push(st.temperature.toFixed(1)+' °C');
  if(typeof st.humidity==='number')p.push(Math.round(st.humidity)+' %');
  if(typeof st.occupancy==='boolean')p.push(st.occupancy?'occupied':'clear');
  if(typeof st.contact==='boolean')p.push(st.contact?'closed':'open');
  if(typeof st.battery==='number')p.push('🔋'+st.battery+'%');
  if(typeof st.power==='number')p.push(st.power+' W');
  if(!p.length){const k=Object.keys(st).filter(k=>k!=='linkquality').slice(0,3);return k.map(k=>k+' '+JSON.stringify(st[k])).join(' · ');}
  return p.join(' · ');
}

function connectSSE(){
  if(S.es)S.es.close();
  const es=new EventSource('api/events');S.es=es;
  es.onopen=()=>{S.online=true;S.sseBackoff=1000;renderHeader();views.devices.refresh();};
  es.onerror=()=>{S.online=false;renderHeader('reconnecting…');es.close();setTimeout(connectSSE,S.sseBackoff);S.sseBackoff=Math.min(S.sseBackoff*2,30000);};

}

          tool(scanBtn,'Who is on the air, on which channel \u2014 works whatever key everyone is on.'),scanOut,
          rbBtn?tool(rbBtn,'Back to the key the devices still use. Nothing is re-paired.'):null,
          st.sequence_collision?el('div',{class:'notice warn',style:'margin-top:12px'},el('b',{text:'Two different keys share one sequence number. '}),'After an interrupted rotation the devices may know the current key under the next number \u2014 every frame is dropped until the label matches. ',el('button',{class:'btn primary sm',style:'margin-left:6px',text:'Re-label the key as sequence '+((st.active_seq+1)&255),onclick:async()=>{const n=(st.active_seq+1)&255;if(!(await confirmDlg('Re-label the network key?',[el('p',{text:'The same key is written again under sequence '+n+' \u2014 the key itself does not change, nothing is re-paired, the radio restarts for a few seconds. Devices that switched during the interrupted rotation hear the coordinator again.'})],'Re-label',false)))return;try{const r=await api('api/rotate_network_key',{mode:'relabel',seq:n});toast(r.relabelled?'Key re-labelled as sequence '+n:'Not verified \u2014 see Logs',!r.relabelled);this._rotPoll(status,btn,true);}catch(e){toast(e.message,true);}}})):null,
          this.rollbackFromBackup(status,btn));
        if(keyOk===false){panel.open=true;status.append(el('div',{class:'notice danger',style:'margin-top:10px'},el('b',{text:'The coordinator is not on the key the devices use. '}),'Open the recovery tools below and roll back to the previous key, or use a backup.'));}
        status.append(el('div',{style:'margin-top:10px'},panel));return;}
      const d=(st.delivered||[]).length,f=Object.keys(st.failed||{}).length,p=Object.keys(st.pending||{}).length,u=(st.unreachable||[]).length,sp=Object.keys(st.switch_pending||{}).length,sw=(st.switched||[]).length;
      const miss=(f?', '+f+' not reachable':'')+(p?', '+p+' asleep (get it when they wake)':'')+(st.extended?' · wait extended ×'+st.extended:'')+(st.resumed?' · resumed after a restart':'');
      const txt={delivering:'Handing the new key to devices… '+d+' delivered'+miss,
        waiting:(f||p?'Waiting for every device to take the key ('+Math.round((st.waiting_s||0)/60)+' min so far) — ':'Switching in '+st.seconds_left+' s — ')+d+' delivered'+miss,
        cancelled:'Cancelled — the old key stays in force.',
        switching:sp?'Everyone has the key. Telling devices to switch — '+sw+' told'+', '+sp+' asleep (told the moment they wake) · '+Math.round((st.waiting_s||0)/60)+' min':'Switching the routers and the coordinator…',
        rolled_back:'Rolled back — '+(st.error||'the devices did not switch')+'. The previous key is in force again; nothing is lost. See Logs for which routers did not answer, then rotate again.',done:'Done: '+d+' devices received the new key'+(st.retried?' ('+st.retried+' on retry)':'')+(f||p?', '+(f+p)+' missed it and must rejoin':'')+(u?' — '+u+' router(s) do not answer on the new key':'')+'. The old key is no longer valid.',
        aborted:'Aborted — '+(st.error||'not every device received the key')+'. Fix the devices below and rotate again.',
        failed:'Failed: '+(st.error||'unknown error')}[ph]||ph;
      clear(status).append(el('span',{class:(ph==='failed'||ph==='aborted'||ph==='rolled_back'||u)?'danger':'',text:txt}));
      const lists=Object.assign({},ph==='aborted'?st.aborted:{},(ph==='done'||ph==='waiting'||ph==='delivering')?st.failed:{},(ph==='done'||ph==='waiting'||ph==='delivering')?st.pending:{},ph==='switching'?st.switch_pending:{});
      if(Object.keys(lists).length)status.append(el('div',{class:'mono sub',text:Object.entries(lists).map(([k,v])=>k+': '+v).join(' · ')}));
      if(st.stalled&&ph==='waiting')status.append(el('div',{class:'notice warn',style:'margin-top:10px'},el('b',{text:'Stalled. '}),'The devices above have not taken the key for '+Math.round((st.waiting_s||0)/60)+' minutes. It keeps being offered; if a device is gone for good, remove it from its device page — or cancel and keep the current key.'));
      if(ph==='waiting'||ph==='delivering'||ph==='switching')status.append(el('button',{class:'btn sm',style:'margin-top:8px',text:'Cancel rotation (keep the current key)',onclick:async()=>{if(!(await confirmDlg('Cancel the key rotation?',[el('p',{text:'The current key stays in force. Devices that already received the new key simply never switch to it.'})],'Cancel rotation',true)))return;try{await api('api/rotate_network_key',{mode:'cancel'});toast('Rotation cancelled');this._rotPoll(status,btn,true);}catch(e){toast(e.message,true);}}}));
      if(u&&ph==='done')status.append(el('div',{class:'mono sub',text:'not answering: '+st.unreachable.join(', ')}));
      if(st.coordinator_key_ok!==false&&st.rollback_available&&!/^(delivering|waiting|switching)$/.test(ph))status.append(el('div',{class:'notice',style:'margin-top:10px'},el('b',{text:'A previous network key is available. '}),'If devices stopped answering after a rotation ("no route", nothing decrypts on the Map), they are still on the previous key: ',
        el('button',{class:'btn sm',style:'margin-left:6px',text:'Roll back to the previous key',onclick:async()=>{if(!(await confirmDlg('Roll back to the previous key?',[el('p',{text:'The coordinator returns to the previous network key — the one the devices still use. The radio restarts for a few seconds; nothing is re-paired. Rotate again afterwards.'})],'Roll back',false)))return;try{const r=await api('api/rotate_network_key',{mode:'rollback'});toast(r.rolled_back?'Coordinator is back on the previous key':'No previous key known — restore a backup taken before the rotation',!r.rolled_back);this._rotPoll(status,btn,true);}catch(e){toast(e.message,true);}}})));
      if(st.coordinator_key_ok===false)status.append(el('div',{class:'notice danger',style:'margin-top:10px'},el('b',{text:'The coordinator is not on the key the devices received. '}),'Devices that switched cannot reach it (commands fail with "no route"). Two ways out, nothing is re-paired: ',
        el('div',{style:'margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center'},
          el('button',{class:'btn primary sm',text:'Finish key switch',title:'The coordinator moves to the new key (radio restarts for a few seconds). Devices that never received it must rejoin — power-cycle them.',onclick:async()=>{try{const r=await api('api/rotate_network_key',{mode:'finish'});toast(r.verified?'Coordinator is on the new key':'The radio still reports another key — see Logs',!r.verified);this._rotPoll(status,btn,true);}catch(e){toast(e.message,true);}}}),
          el('span',{class:'sub',text:'coordinator → new key; the devices that missed it must rejoin'}),
          el('button',{class:'btn sm',text:'Roll back',title:'The coordinator goes back to the key the devices use (from the keystore or the radio\'s alternate key slot). Nothing is re-paired. Rotate again afterwards.',onclick:async()=>{if(!(await confirmDlg('Roll the switch back?',[el('p',{text:'The coordinator returns to the previous network key — the one the devices still use. The radio restarts for a few seconds; nothing is re-paired.'})],'Roll back',false)))return;try{const r=await api('api/rotate_network_key',{mode:'rollback'});toast(r.rolled_back?'Coordinator is back on the previous key':'No previous key known — restore a backup taken before the rotation',!r.rolled_back);this._rotPoll(status,btn,true);}catch(e){toast(e.message,true);}}}),
          el('span',{class:'sub',text:'coordinator → the key the devices use; rotate again afterwards'}))));
      btn.disabled=ph==='delivering'||ph==='waiting'||ph==='switching'||btn.title!=='';
      if(ph==='waiting'||ph==='delivering')status.append(el('div',{class:'sub',style:'margin-top:4px'},'The wait extends itself while a device is missing (up to the maximum under Settings → Zigbee).'));
      if(!once||ph==='delivering'||ph==='waiting'||ph==='switching')setTimeout(()=>this._rotPoll(status,btn,false),2000);
    }catch(e){}
  }
};

/* ============ boot ============ */
async function loadBridge(){try{S.bridge=await api('api/bridge');S.pj=Object.assign(S.pj,S.bridge.permit_join||{});if(S.pj.open)S.pj.total=S.pj.seconds_left;renderHeader();}catch(e){renderHeader('bridge unreachable');}}
buildNav();
$('#h-sec').addEventListener('click',()=>{views.logs.tab='audit';views.logs.aFilter='security';location.hash='#logs/security';if(S.page==='logs')route();});
$('#h-sec').addEventListener('keydown',e=>{if(e.key==='Enter')$('#h-sec').click();});
window.addEventListener('hashchange',route);
(async()=>{await loadBridge();try{const sec=await api('api/audit?level=security&n=1');if(sec.length){S.lastSec=sec[sec.length-1];renderHeader();}}catch(e){}try{S.devices=await api('api/devices');S.devMap=new Map(S.devices.map(d=>[d.ieee,d]));}catch(e){}route();connectSSE();setInterval(()=>{if(S.page==='devices')views.devices.rows.forEach(r=>r.upd());},30000);setInterval(loadBridge,60000);})();
</script>
