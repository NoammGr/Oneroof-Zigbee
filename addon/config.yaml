name: One Roof Zigbee
version: "2.12.0"
slug: oneroof_zigbee
description: Zigbee gateway with a built-in MQTT broker, designed around security - pair devices, import a previous setup, everything under one roof.
url: https://github.com/NoammGr/Oneroof-Zigbee
arch: [aarch64, amd64]
startup: application
boot: auto
init: false
# --- hardening: what we deliberately do NOT request ---------------------
# no hassio_api, no homeassistant_api, no host_network, no privileged,
# no docker_api, no full_access, no "share" or "homeassistant_config" mounts.
uart: true          # the only privilege: the USB dongle
udev: true
# `mqtt:provide` registers this add-on as Home Assistant's MQTT service (the role the Mosquitto add-on
# had): the MQTT integration and add-ons that auto-detect the broker (e.g. One Roof Bridge) connect to
# it automatically. It grants no other API access.
services:
  - mqtt:provide
ingress: true       # UI is reachable ONLY through HA's authenticated Ingress proxy
ingress_port: 8099
panel_icon: mdi:zigbee
panel_title: OneRoof Zigbee
# -----------------------------------------------------------------------
# /data is mounted by the Supervisor itself (options.json lives there). Our files — keystore, users,
# CA certificate, backups, firmware — go to the add-on config folder, visible to you under
# /addon_configs/<slug>/ via Samba or the File editor, and included in Home Assistant backups.
map:
  - type: addon_config
    read_only: false
    path: /config
  # read-only view of the HA config share so the UI can import a previous setup's files
  - type: homeassistant_config
    read_only: true
    path: /homeassistant
# Host ports are OFF by default: inside Home Assistant the MQTT integration reaches the add-on by its
# internal hostname (shown in the add-on log), and an existing broker add-on may already own 8883/1883
# on the host. Enable a host port in the Network section only for clients outside Home Assistant.
ports:
  8883/tcp: null
  1883/tcp: null
ports_description:
  1883/tcp: Plain MQTT for clients outside Home Assistant that cannot do TLS (inside Home Assistant it is always available by hostname)
  8883/tcp: MQTT over TLS for clients outside Home Assistant (CA certificate in the add-on config folder, tls/ca.crt)
options:
  network_coordinator: ""
  channel: 15
  strict_install_codes: false
  permit_join_max_seconds: 120
  permit_join_require_install_code: false
  permit_join_close_after_first_join: true
  rotate_key_after_plain_join: true
  mqtt_port: 8883
  mqtt_plaintext_port: 1883
  tls_require_client_cert: false
  tls_client_ca: ""
  homeassistant_mqtt_user: homeassistant
  homeassistant_can_permit_join: false
  legacy_layout: false        # turned on automatically when you import a previous setup
  external_broker: ""
  external_broker_user: ""
  external_broker_password: ""
  base_topic: ""
  tls_hostname: ""
  tls_cert: ""
  tls_key: ""
  log_level: info
  drop_privileges: true       # automatic: drops to an unprivileged user when the coordinator is accessible that way
schema:
  serial_port: device(subsystem=tty)?
  network_coordinator: str?
  channel: int(11,26)
  strict_install_codes: bool
  permit_join_max_seconds: int(1,254)
  permit_join_require_install_code: bool
  permit_join_close_after_first_join: bool?
  rotate_key_after_plain_join: bool?
  mqtt_port: port
  mqtt_plaintext_port: int(0,65535)?
  tls_require_client_cert: bool?
  tls_client_ca: str?
  homeassistant_mqtt_user: str
  homeassistant_can_permit_join: bool
  legacy_layout: bool?
  external_broker: str?
  external_broker_user: str?
  external_broker_password: password?
  base_topic: str?
  tls_hostname: str?
  tls_cert: str?
  tls_key: str?
  log_level: list(debug|info|warning|error)
  drop_privileges: bool?
# image: ghcr.io/noammgr/oneroof-zigbee-{arch}   # enable once the release workflow has published images; until then HA builds locally
